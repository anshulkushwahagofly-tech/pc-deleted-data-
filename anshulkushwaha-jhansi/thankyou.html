<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thank You | Anshul Kushwaha</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#0f141a;
  --text:#e8e8f2;
  --accent:#899cb3;
  --card:#1a232c;
  --border:rgba(255,255,255,.07);
}
body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  text-align:center;
}
.ty-box {
  background:var(--card);
  padding:50px 40px;
  border-radius:20px;
  border:1px solid var(--border);
  max-width:500px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.ty-box h1 {
  font-family:'Playfair Display',serif;
  font-size:2.5rem;
  margin:0 0 15px 0;
}
.ty-box p {
  color:#7a7a9a;
  line-height:1.6;
  margin-bottom:30px;
}
.ty-box a {
  display:inline-block;
  padding:12px 30px;
  background:linear-gradient(135deg,var(--accent),#ffffff);
  color:#000;
  font-weight:600;
  text-decoration:none;
  border-radius:30px;
  transition:transform 0.3s;
}
.ty-box a:hover {
  transform:scale(1.05);
}
</style>
</head>
<body>
  <div class="ty-box">
    <h1>Thank You! 🚀</h1>
    <p>Your message has been successfully sent. I will review it and get back to you as soon as possible.</p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
